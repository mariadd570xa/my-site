<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-5">
        <div class="row">
            <!-- Левая колонка: данные пользователя -->
            <div class="col-md-4">
                <div class="card shadow-sm p-4 text-center">
                    <div class="mb-3">
                        <!-- Аватар-заглушка -->
                        <div class="bg-secondary rounded-circle mx-auto d-flex align-items-center justify-content-center" 
                             style="width: 120px; height: 120px; font-size: 48px; color: white;">
                            👤
                        </div>
                    </div>
                    <h4>Александр Панин</h4>
                    <p class="text-muted">pikmi@example.com</p>
                    <hr>
                    <div class="text-start">
                        <p><strong>Телефон:</strong> +7 (999) 123-45-67</p>
                        <p><strong>Дата регистрации:</strong> 10.01.2026</p>
                    </div>
                    <a href="login.html" class="btn btn-danger w-100 mt-3">Выйти</a>
                </div>
            </div>

            <!-- Правая колонка: история заказов -->
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3">История записей</h4>

                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>№ записи</th>
                                    <th>Дата</th>
                                    <th>Сумма</th>
                                    <th>Статус</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><strong>#1001</strong></td>
                                    <td>15.06.2026</td>
                                    <td>10 000 ₽</td>
                                    <td><span class="badge bg-success">Готово</span></td>
                                    <td><button class="btn btn-sm btn-outline-primary">Подробнее</button></td>
                                </tr>
                                <tr>
                                    <td><strong>#1002</strong></td>
                                    <td>12.06.2026</td>
                                    <td>5 300 ₽</td>
                                    <td><span class="badge bg-warning text-dark">В процесе</span></td>
                                    <td><button class="btn btn-sm btn-outline-primary">Подробнее</button></td>
                                </tr>
                                <tr>
                                    <td><strong>#1003</strong></td>
                                    <td>05.06.2026</td>
                                    <td>7 800 ₽</td>
                                    <td><span class="badge bg-info">1 сеанс</span></td>
                                    <td><button class="btn btn-sm btn-outline-primary">Подробнее</button></td>
                                </tr>
                                <tr>
                                    <td><strong>#1004</strong></td>
                                    <td>28.05.2026</td>
                                    <td>30 000 ₽</td>
                                    <td><span class="badge bg-danger">Отменен</span></td>
                                    <td><button class="btn btn-sm btn-outline-primary">Подробнее</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
